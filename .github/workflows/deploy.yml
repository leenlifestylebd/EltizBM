name: Deploy to production

# Runs automatically whenever master changes (i.e. after a PR is merged).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: Manual preflight (does not deploy)
        type: choice
        options: [inspect]
        default: inspect

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH → pull latest & run Laravel deploy steps
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/domains/leen.com.bd/fulfillo
            git fetch origin
            git reset --hard origin/master
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            echo "Deployed: $(git log --oneline -1)"

  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check production access without changing the application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 45s
          command_timeout: 2m
          script: |
            set -e
            cd ~/domains/leen.com.bd/fulfillo
            printf 'Current commit: '
            git rev-parse HEAD
            printf 'Tracked modifications: '
            git status --porcelain --untracked-files=no | wc -l
            php -v | head -n 1
            command -v mysqldump || command -v mariadb-dump
            test -f .env
            test -d storage
            test -d ../public_html/app
            echo 'Production backup prerequisites available'
