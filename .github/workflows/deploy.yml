name: Deploy to production

# Runs automatically whenever master changes (i.e. after a PR is merged).
on:
  push:
    branches: [master]
  workflow_dispatch: {}   # also lets you trigger it manually from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → pull latest & run Laravel deploy steps
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/domains/leen.com.bd/fulfillo
            git fetch origin
            git reset --hard origin/master
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            echo "Deployed: $(git log --oneline -1)"
