name: Payroll regression tests
on:
  push:
    branches: [codex/payroll-carry-forward-20260911]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit
      - run: node --test tests/service-worker-cache.cjs tests/Feature/facebook-workflow.test.cjs
